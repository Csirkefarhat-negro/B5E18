<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Új eszközök létrehozása</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>

    <div class="container py-5">
        <h1 class="mb-4">Új eszközök létrehozása</h1>

        <form id="eszkozForm">

            <div class="row g-3">


                <div class="col-md-6">
                    <label class="form-label">Név</label>
                    <input id="nev" class="form-control" type="text">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Leltári szám</label>
                    <input id="LeltariSzam" class="form-control" type="text">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Kategoria</label>
                    <input id="Kategoria" class="form-control" type="text">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Gyártó</label>
                    <input id="Gyarto" class="form-control" type="text">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Modell</label>
                    <input id="Modell" class="form-control" type="text">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Terem</label>
                    <input id="Terem" class="form-control" type="text">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Állapot</label>
                    <input id="Allapot" class="form-control" type="text">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Beszerzési ár</label>
                    <input id="BeszerzesAr" class="form-control" type="text">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Beszerzés dátuma</label>
                    <input id="BeszerzesDatuma" class="form-control" type="text">
                </div>

                <div class="col-md-4">
                    <div class="form-check mt-4">
                        <label class="form-check-input">Használatban van</label>
                        <input id="kolcsonozheto" class="form-check-input" type="checkbox">
                    </div>





                </div>






            </div>


        </form>


    </div>
    
</body>
</html>
